server:
  # 8081, not 8080: native EDB/Postgres services (PEM httpd) own 8080 on this machine.
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: SESSION
  error:
    # Final-review fix: Spring Boot's default (never) strips "message" from
    # every error JSON body, so frontend/lib/properties.ts's uploadMedia -
    # which reads that field to show the real reason a file was rejected -
    # always fell back to its generic message. Every message this backend
    # sets on a ResponseStatusException is one we wrote ourselves for the
    # user to read (e.g. "File x.png is not a decodable image"), so it's
    # safe to always include.
    include-message: always
spring:
  application:
    name: crm-backend
  servlet:
    multipart:
      # Final-review fix: Spring's own multipart limit must sit strictly
      # above PropertyMediaController's 20MB-per-file cap, or Spring rejects
      # an oversized part itself (a 413, bypassing the controller entirely)
      # before the controller's own check - and its own clean "File X
      # exceeds the 20MB limit" 400 - ever gets a chance to run. 21MB gives
      # just enough headroom for that check to always be the one that fires.
      max-file-size: 21MB
      max-request-size: 660MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm_dev_only}
  flyway:
    enabled: true
app:
  default-agency-id: 11111111-1111-1111-1111-111111111111
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:change-me-now}
storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_S3_BUCKET:crm-media}
    access-key: ${MINIO_ROOT_USER:crm}
    secret-key: ${MINIO_ROOT_PASSWORD:crm_dev_only}
    public-base-url: ${STORAGE_S3_PUBLIC_BASE_URL:http://localhost:9000/crm-media}
management:
  endpoints:
    web:
      exposure:
        include: health
      # Actuator endpoints use their own handler mapping and ignore
      # WebMvcConfigurer CORS mappings, so CORS for /actuator/** lives here.
      cors:
        allowed-origins: http://localhost:3000
        allowed-methods: GET,OPTIONS
  endpoint:
    health:
      show-details: always
