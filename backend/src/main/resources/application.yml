server:
  # 8081, not 8080: native EDB/Postgres services (PEM httpd) own 8080 on this machine.
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: crm-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm_dev_only}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
      # Actuator endpoints use their own handler mapping and ignore
      # WebMvcConfigurer CORS mappings, so CORS for /actuator/** lives here.
      cors:
        allowed-origins: http://localhost:3000
        allowed-methods: GET,OPTIONS
  endpoint:
    health:
      show-details: always
