services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_dev_only
    ports:
      # Host port 5435 (not 5432): avoids clashing with any native Postgres
      # install already bound to 5432 on the host machine. Container-internal
      # port stays 5432 — only the host-side mapping changed.
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 3s
      retries: 5
